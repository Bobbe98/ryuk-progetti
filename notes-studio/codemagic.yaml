workflows:
  android-apk:
    name: Notes Studio – Android APK (Release)
    max_build_duration: 60
    working_directory: notes-studio
    environment:
      flutter: stable
    cache:
      cache_paths:
        - $HOME/.pub-cache
    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Build APK
        script: flutter build apk --release --split-per-abi

    artifacts:
      - build/app/outputs/flutter-apk/*.apk

    publishing:
      email:
        recipients:
          - robertovaleo@gmail.com
        notify:
          success: true
          failure: true

  ios-sideload:
    name: Notes Studio – iOS Sideload (Unsigned IPA)
    max_build_duration: 60
    working_directory: notes-studio
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
    cache:
      cache_paths:
        - $HOME/.pub-cache
        - ios/Pods
    scripts:
      - name: Flutter pub get
        script: flutter pub get

      - name: Pod install
        script: |
          cd ios
          pod install

      - name: Build iOS (no codesign)
        script: |
          flutter build ios --release --no-codesign

      - name: Package IPA
        script: |
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -r Runner.app Payload/
          zip -r ../../../notes_studio_unsigned.ipa Payload
          rm -rf Payload

    artifacts:
      - notes_studio_unsigned.ipa

    publishing:
      email:
        recipients:
          - robertovaleo@gmail.com
        notify:
          success: true
          failure: true
